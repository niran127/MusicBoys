<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicBoys</title>
    <link rel="stylesheet" href="styles/general.css" />
  </head>
  <body>
    <header>
      <div class="logo">Logo</div>
      <button class="moodDisplay">Mood:</button>
      <div class="userPfp">Gebruiker</div>
    </header>
    <main>
      <h1 class="appTitle">MusicBoys</h1>
      <div class="moodMenu">
        Kies je mood
        <div class="mood Chill">Chill</div>
        <div class="mood Focus">Focus</div>
        <div class="mood Feestje">Feestje</div>
        <div class="mood Verdrietig">Verdrietig</div>
        <div class="mood Workout">Workout</div>
      </div>
      <div class="qckActionMenu">
        Snelle acties
        <div class="qckActionsBtn">
          Zoek muziek
          <p>Zoek naar artiesten en nummers</p>
        </div>
        <div class="qckActionsBtn">
          Mijn collectie
          <p>Bekijk je gelikete nummers</p>
        </div>
        <div class="qckActionsBtn">
          Maak playlist
          <p>Maak een playlist op basis van je mood</p>
        </div>
      </div>
    </main>
    <footer class="pageSelection">
      <div class="Home">Home</div>
      <div class="Search">Zoeken</div>
      <div class="PLaylists">Playlists</div>
      <div class="Game">Game</div>
    </footer>
  </body>
</html>
