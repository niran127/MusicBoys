version: '3.8'

services:
  app:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/musicboys
    ports:
      - "3050:3050"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: